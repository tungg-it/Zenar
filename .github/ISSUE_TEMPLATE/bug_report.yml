name: Bug report
description: Something in Zenar does not work as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please check existing issues first. Never paste Secret values or tokens.
  - type: input
    id: version
    attributes:
      label: Zenar version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux (AppImage), Linux (.deb), Linux (.rpm)]
    validations:
      required: true
  - type: input
    id: git
    attributes:
      label: Git host
      placeholder: GitHub, GitLab.com, self-hosted GitLab, ...
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a Collection
        2. ...
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
