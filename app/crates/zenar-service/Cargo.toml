[package]
name = "zenar-service"
version.workspace = true
edition.workspace = true

[dependencies]
zenar-format = { path = "../zenar-format" }
zenar-git = { path = "../zenar-git" }
zenar-merge = { path = "../zenar-merge" }
serde = { version = "1", features = ["derive"] }
