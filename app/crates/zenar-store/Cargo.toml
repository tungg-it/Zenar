[package]
name = "zenar-store"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ts-rs = "10"
zenar-format = { path = "../zenar-format" }
zenar-http = { path = "../zenar-http" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
