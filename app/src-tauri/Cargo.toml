[package]
name = "zenar"
version.workspace = true
edition.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
zenar-format = { path = "../crates/zenar-format" }
zenar-service = { path = "../crates/zenar-service" }
zenar-merge = { path = "../crates/zenar-merge" }
zenar-http = { path = "../crates/zenar-http" }
zenar-store = { path = "../crates/zenar-store" }
zenar-git = { path = "../crates/zenar-git" }

serde_json = "1"
tauri-plugin-opener = "2"
